# Specific display-panel drivers. NOT populated on the AGX Orin/Thor devkits
# (no panel node in their devicetrees) — opt-in per SKU that adds a panel.
# The DRM/DSI/bridge core stays in the shared SoC config.
CONFIG_DRM_PANEL_BOE_TV101WUM_NL6=m
CONFIG_DRM_PANEL_DSI_CM=m
CONFIG_DRM_PANEL_LVDS=m
CONFIG_DRM_PANEL_SIMPLE=m
CONFIG_DRM_PANEL_EDP=m
CONFIG_DRM_PANEL_MANTIX_MLAF057WE51=m
CONFIG_DRM_PANEL_RAYDIUM_RM67191=m
CONFIG_DRM_PANEL_SITRONIX_ST7703=m
CONFIG_DRM_PANEL_TRULY_NT35597_WQXGA=m

# Display bridges / panel backlight (no panel/bridge populated on the AGX devkits)
CONFIG_DRM_DISPLAY_CONNECTOR=m
CONFIG_DRM_SIMPLE_BRIDGE=m
CONFIG_BACKLIGHT_LP855X=m
