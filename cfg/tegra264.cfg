# tegra264 config overlay — applied after cfg/tegra.cfg by bsp/tegra264.
# Shared hardware config works for both machines today; put machine-specific
# selections here (e.g. disabling the other SoC to reduce kernel size).

# --- OP-TEE (secure world reached over ARM FF-A) ---
# Thor talks to OP-TEE as an FF-A secure partition (Hafnium SPMC). OP-TEE core is
# built-in (CONFIG_OPTEE=y from genericarm64), so the FF-A transport must be
# built-in too: left as =m, IS_REACHABLE(CONFIG_ARM_FFA_TRANSPORT) is false, the
# OP-TEE FF-A driver is compiled out, and /dev/tee* is never created.
CONFIG_ARM_FFA_TRANSPORT=y
