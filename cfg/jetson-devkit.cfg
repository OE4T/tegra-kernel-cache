# Jetson devkit board peripherals — NOT SoC-intrinsic. Attached via
# KERNEL_FEATURES (features/tegra/jetson-devkit.scc) to the devkit machines
# only, so a custom carrier on the same SoC does not inherit them.

# Realtek Wi-Fi modules (PCIe)
CONFIG_RTW88=m
CONFIG_RTW88_CORE=m
CONFIG_RTW88_PCI=m
CONFIG_RTW88_8822C=m
CONFIG_RTW88_8822CE=m
# CONFIG_RTW88_DEBUG is not set
# CONFIG_RTW88_DEBUGFS is not set
CONFIG_RTW89=m
CONFIG_RTW89_CORE=m
CONFIG_RTW89_PCI=m
CONFIG_RTW89_8852C=m
CONFIG_RTW89_8852CE=m
# CONFIG_RTW89_DEBUG is not set
# CONFIG_RTW89_DEBUGFS is not set

# Realtek Ethernet (PCIe) - AGX Thor carrier only
CONFIG_R8169=m

# 10G Ethernet PHY - AGX Orin (p3737) carrier only
CONFIG_AQUANTIA_PHY=m

# On-board power/thermal monitors (DT: ti,ina3221 / ti,ina219 / ti,tmp451;
# ti,ina238 on the Thor p4071 carrier)
CONFIG_SENSORS_INA3221=m
CONFIG_SENSORS_INA2XX=m
CONFIG_SENSORS_INA238=m
CONFIG_SENSORS_LM90=m

# On-board audio codec (DT: realtek,rt5640)
CONFIG_SND_SOC_RT5640=m

# Board chips found in the devkit DTs (not SoC-intrinsic)
CONFIG_I2C_MUX_PCA954x=y      # camera-module I2C mux
